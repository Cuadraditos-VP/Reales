name: Actualizar cotizaciones

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # cada 15 minutos (GitHub puede demorarlas)
  workflow_dispatch:        # botón "Run workflow" para correrla a mano

permissions:
  contents: write

concurrency:
  group: cotizaciones
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/cotizaciones.mjs
      - name: Guardar si cambió
        run: |
          if git diff --quiet -- cotizaciones.json; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add cotizaciones.json
          git commit -m "Cotizaciones $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
